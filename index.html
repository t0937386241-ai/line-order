<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品線上訂購</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f5f5f7; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    h2 { margin-top: 0; color: #333; text-align: center; }
    .user-info { margin-bottom: 15px; padding: 10px; background: #eef6ff; border-radius: 8px; font-size: 14px; color: #1a73e8; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input[type="text"], input[type="tel"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .product-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .product-item:last-child { border-bottom: none; }
    .product-name { font-size: 16px; }
    .product-price { color: #888; font-size: 14px; }
    .qty-input { width: 60px; padding: 5px; text-align: center; border: 1px solid #ccc; border-radius: 6px; }
    .total-box { background: #fff8f8; padding: 15px; border-radius: 8px; text-align: right; font-weight: bold; font-size: 18px; margin-bottom: 15px; color: #333; }
    #totalAmount { color: #e93524; font-size: 22px; margin: 0 5px; }
    button { width: 100%; padding: 12px; background: #06C755; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>

<div class="card">
  <h2>專屬訂購單</h2>
  <div class="user-info" id="userDisplay">正在驗證 LINE 身分...</div>
  
  <form id="orderForm">
    <!-- 姓名與稱謂 -->
    <div class="form-group">
      <label>姓氏</label>
      <div style="margin-bottom: 8px;">
        <input type="text" id="customerName" placeholder="請輸入姓氏 + 點選下方稱謂" required>
      </div>
      <div style="display: flex; gap: 20px; font-weight: normal;">
        <label style="cursor: pointer; display: flex; align-items: center; gap: 5px;">
          <input type="radio" name="customerTitle" value="先生" checked> 先生
        </label>
        <label style="cursor: pointer; display: flex; align-items: center; gap: 5px;">
          <input type="radio" name="customerTitle" value="小姐"> 小姐
        </label>
      </div>
    </div>
    
    <!-- 聯絡電話 -->
    <div class="form-group">
      <label>手機號碼</label>
      <input type="tel" id="customerPhone" placeholder="請輸入有效的手機號碼，例如：0912345678" required>
    </div>
    
    <!-- 訂購品項（獨立欄位區塊） -->
    <div class="form-group">
      <label>訂購品項 (請填寫數量)</label>
      
      <!-- 品項 1 -->
      <div class="product-item">
        <div>
          <div class="product-name">🐷高麗菜豬肉水餃</div>
          <div class="product-price">$330 / 袋</div>
        </div>
        <input type="number" id="qty1" class="qty-input" data-price="330" min="0" value="0">
      </div>
      
      <!-- 品項 2 -->
      <div class="product-item">
        <div>
          <div class="product-name">🐷韭菜豬肉水餃</div>
          <div class="product-price">$330 / 袋</div>
        </div>
        <input type="number" id="qty2" class="qty-input" data-price="330" min="0" value="0">
      </div>
      
      <!-- 品項 3 -->
      <div class="product-item">
        <div>
          <div class="product-name">🦐鮮蝦高麗菜水餃</div>
          <div class="product-price">$450 / 袋</div>
        </div>
        <input type="number" id="qty3" class="qty-input" data-price="450" min="0" value="0">
      </div>
      
      <!-- 品項 4 -->
      <div class="product-item">
        <div>
          <div class="product-name">🦐鮮蝦韭菜水餃</div>
          <div class="product-price">$450 / 袋</div>
        </div>
        <input type="number" id="qty4" class="qty-input" data-price="450" min="0" value="0">
      </div>
    </div>

    <!-- 總計金額 -->
    <div class="total-box">
      總計：<span id="totalAmount">0</span> 元
    </div>
    
    <button type="submit" id="submitBtn" disabled>確認提交訂單</button>
  </form>
</div>

<script>
  // ⚠️ 請修改為你自己的 LIFF ID 與 GAS URL ⚠️
  const MY_LIFF_ID = "2012345831-YBYAH5L7";
  const GAS_URL = "https://script.google.com/macros/s/AKfycbytwIOQ34JtREvpztc_-dixa3uuH1nt8qp_3HsIWynahQN3P3wIGuBKyJyTI4nfoiN2pw/exec";

  let currentUser = { userId: "", displayName: "" };
  let finalTotal = 0;

  // 1. 自動計算總金額
  const qtyInputs = document.querySelectorAll('.qty-input');
  const totalDisplay = document.getElementById('totalAmount');

  function calculateTotal() {
    finalTotal = 0;
    qtyInputs.forEach(input => {
      const qty = parseInt(input.value) || 0;
      const price = parseInt(input.getAttribute('data-price')) || 0;
      finalTotal += (qty * price);
    });
    totalDisplay.innerText = finalTotal;
  }

  qtyInputs.forEach(input => {
    input.addEventListener('input', calculateTotal);
  });

  // 2. 初始化 LIFF
  async function main() {
    try {
      await liff.init({ liffId: MY_LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      
      const profile = await liff.getProfile();
      currentUser.userId = profile.userId;
      currentUser.displayName = profile.displayName;
      
      document.getElementById("userDisplay").innerText = `訂購帳號：${profile.displayName}`;
      document.getElementById("submitBtn").disabled = false;
    } catch (err) {
      document.getElementById("userDisplay").innerText = "LINE 驗證失敗，請開啟 LINE 再試";
    }
  }

  // 3. 提交表單資料
  document.getElementById("orderForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    
    const customerTitle = document.querySelector('input[name="customerTitle"]:checked').value;
    const rawName = document.getElementById("customerName").value.trim();
    const customerPhone = document.getElementById("customerPhone").value.trim();

    // 驗證姓名
    if (!rawName) {
      alert("請填寫姓氏！");
      document.getElementById("customerName").focus();
      return;
    }

    // 驗證電話格式（9~12碼數字/空格/連字號）
    const simplePhoneRegex = /^[\d\-\s]{9,12}$/;
    if (!simplePhoneRegex.test(customerPhone)) {
      alert("請輸入有效的聯絡電話（例如：0912345678）！");
      document.getElementById("customerPhone").focus();
      return;
    }

    // 取得各商品數量
    const qty1 = parseInt(document.getElementById("qty1").value) || 0;
    const qty2 = parseInt(document.getElementById("qty2").value) || 0;
    const qty3 = parseInt(document.getElementById("qty3").value) || 0;
    const qty4 = parseInt(document.getElementById("qty4").value) || 0;

    if ((qty1 + qty2 + qty3 + qty4) === 0) {
      alert("請至少選擇一項商品數量！");
      return;
    }

const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = "訂單傳送中..."; // 1. 一開始先顯示傳送中

    const payload = {
      userId: currentUser.userId,
      displayName: currentUser.displayName,
      name: `${rawName} ${customerTitle}`,
      phone: customerPhone,
      item1: qty1,
      item2: qty2,
      item3: qty3,
      item4: qty4,
      totalAmount: finalTotal
    };

    try {
      // 同時發送請求並建立一個至少 5 秒的延遲計時器，讓買家看得到「訂單傳送中...」
      const fetchPromise = fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      
      const delayPromise = new Promise(resolve => setTimeout(resolve, 3000)); // 3秒延遲

      // 等待網路請求完成，且至少經過 3 秒
      const [resp] = await Promise.all([fetchPromise, delayPromise]);
      const resData = await resp.json();
      
      if (resData.status === "success") {
        btn.innerText = "訂單已傳送！"; // 2. 成功後切換文字
        alert(`訂單建立成功！單號：${resData.orderId}`);
        liff.closeWindow();
      } else {
        alert("提交失敗，請重試");
        btn.disabled = false;
        btn.innerText = "確認提交訂單";
      }
    } catch (err) {
      alert("傳送發生錯誤，請檢查網路連線或重試");
      btn.disabled = false;
      btn.innerText = "確認提交訂單";
    }
  });

  main();
</script>
</body>
</html>
