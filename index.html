<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品線上訂購</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f5f5f7; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    h2 { margin-top: 0; color: #333; }
    .user-info { margin-bottom: 15px; padding: 10px; background: #eef6ff; border-radius: 8px; font-size: 14px; color: #1a73e8; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #06C755; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>

<div class="card">
  <h2>商品訂購單</h2>
  <div class="user-info" id="userDisplay">正在驗證 LINE 身分...</div>
  
  <form id="orderForm">
    <div class="form-group">
      <label>訂購品項與數量</label>
      <textarea id="items" rows="3" placeholder="例如：商品 A x 2, 商品 B x 1" required></textarea>
    </div>
    
    <div class="form-group">
      <label>預計總金額</label>
      <input type="number" id="totalAmount" placeholder="請輸入金額" required>
    </div>
    
    <button type="submit" id="submitBtn" disabled>確認提交訂單</button>
  </form>
</div>

<script>
  // 替換為你的 LIFF ID 與 GAS URL
  const MY_LIFF_ID = "2012345831-YBYAH5L7";
  const GAS_URL = "https://script.google.com/macros/s/AKfycbytwIOQ34JtREvpztc_-dixa3uuH1nt8qp_3HsIWynahQN3P3wIGuBKyJyTI4nfoiN2pw/exec";

  let currentUser = { userId: "", displayName: "" };

  async function main() {
    await liff.init({ liffId: MY_LIFF_ID });
    
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    
    const profile = await liff.getProfile();
    currentUser.userId = profile.userId;
    currentUser.displayName = profile.displayName;
    
    document.getElementById("userDisplay").innerText = `訂購人：${profile.displayName}`;
    document.getElementById("submitBtn").disabled = false;
  }

  document.getElementById("orderForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = "訂單傳送中...";

    const payload = {
      userId: currentUser.userId,
      displayName: currentUser.displayName,
      items: document.getElementById("items").value,
      totalAmount: document.getElementById("totalAmount").value
    };

    try {
      const resp = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const resData = await resp.json();
      
      if (resData.status === "success") {
        alert(`訂單建立成功！單號：${resData.orderId}`);
        liff.closeWindow();
      } else {
        alert("提交失敗，請重試");
        btn.disabled = false;
        btn.innerText = "確認提交訂單";
      }
    } catch (err) {
      alert("傳送發生錯誤");
      btn.disabled = false;
      btn.innerText = "確認提交訂單";
    }
  });

  main();
</script>
</body>
</html>
